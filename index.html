<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links | Generous Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6"
  >
    <div class="max-w-md w-full text-center">
      <div class="mb-8">
        <img
          src="logo.png"
          alt="Studio Logo"
          class="w-28 h-28 mx-auto rounded-full border-4 border-indigo-500 shadow-xl shadow-indigo-500/20 mb-4 object-cover"
        />
        <h1 class="text-2xl font-bold tracking-tight">Generous Studio</h1>
        <p class="text-slate-400 mt-2 text-sm">
          Indie Game Dev Studio<br />
          Crafting our dream JRPG - Spiritalis :)
        </p>
      </div>

      <div class="space-y-4">
        <a
          href="https://instagram.com/generous_studio"
          target="_blank"
          class="glass group flex items-center p-4 rounded-xl transition-all duration-300 hover:bg-pink-600 hover:scale-[1.02] active:scale-[0.98]"
        >
          <div class="w-10 text-center text-xl">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <span class="flex-grow font-semibold"
            >Connect with us on Instagram</span
          >
        </a>

        <a
          href="https://discord.gg/Keg5yMDRZr"
          target="_blank"
          class="glass group flex items-center p-4 rounded-xl transition-all duration-300 hover:bg-indigo-500 hover:scale-[1.02] active:scale-[0.98]"
        >
          <div class="w-10 text-center text-xl">
            <i class="fa-brands fa-discord"></i>
          </div>
          <span class="flex-grow font-semibold">Join our Discord</span>
        </a>

        <a
          href="mailto:rpgenerous@gmail.com"
          class="glass group flex items-center p-4 rounded-xl transition-all duration-300 hover:bg-indigo-600 hover:scale-[1.02] active:scale-[0.98]"
        >
          <div class="w-10 text-center text-xl">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <span class="flex-grow font-semibold">Contact us via email</span>
        </a>
      </div>

      <footer class="mt-12 text-slate-500 text-xs uppercase tracking-widest">
        Made with ❤︎
      </footer>
    </div>
  </body>
</html>
